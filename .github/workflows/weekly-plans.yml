name: Weekly meal plans

on:
  schedule:
    # Sundays at 15:00 UTC, which is 18:00 in Nairobi
    - cron: "0 15 * * 0"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the backend to generate this week's plans
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 30 --retry-all-errors \
            -X POST "https://mealplanner-ki6s.onrender.com/api/mealplans/cron/weekly/" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"